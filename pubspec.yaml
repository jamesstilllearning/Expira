name: expira
description: "ExPIRA - smart household expiration tracker."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  mobile_scanner: ^7.4.2
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.0
  flutter_timezone: ^5.1.1
  sqflite: 2.3.3+1
  path: ^1.9.0
  file_picker: ^13.1.0
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  fl_chart: ^0.69.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8

  # Phase 0: Architecture dependencies
  get_it: ^8.0.0
  injectable: ^2.4.1
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  go_router: ^14.2.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  flutter_secure_storage: ^11.2.0
  logger: ^2.4.0
  equatable: ^2.0.5
  intl: ^0.19.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: 2.2.5
  flutter_launcher_icons: ^0.14.4

  # Code generation
  build_runner: ^2.4.11
  injectable_generator: ^2.6.1
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/sky_day.jpg
    - assets/images/sky_night.jpg
    - assets/images/expilogo.png
    - assets/images/character/expira_mascot.png

flutter_launcher_icons:
  android: true
  image_path: "assets/images/EXPLOG.png"
  adaptive_icon_background: "#B7F3AF"
  adaptive_icon_foreground: "assets/images/EXPLOG.png"